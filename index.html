  Bolus repas
  Créé par Vincent BOURDIN
-->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1f5f66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bolus repas</title>
<style>

  /* ========== Variables et base ========== */

  :root{
    --bg:#eef2f3;
    --card:#ffffff;
    --ink:#12262a;
    --ink-soft:#5b6b6e;
    --teal:#1f5f66;
    --teal-dark:#143f44;
    --line:#dde4e5;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    padding-bottom:40px;
  }
  header{
    background:var(--teal);
    color:#fff;
    padding:22px 20px 26px;
    border-radius:0 0 24px 24px;
  }
  header h1{
    margin:0;
    font-size:1.3rem;
    letter-spacing:0.02em;
    font-weight:700;
  }
  main{
    max-width:480px;
    margin:0 auto;
    padding:18px 16px 0;
  }
  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 1px 3px rgba(18,38,42,0.08);
  }
  .card h2{
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    margin:0 0 12px;
    font-weight:700;
  }
  /* ========== Repas et ratio ========== */

  .meals{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .meal-btn{
    border:2px solid var(--line);
    background:#fff;
    border-radius:12px;
    padding:14px 8px;
    font-size:0.95rem;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s, background .15s;
    text-align:center;
  }
  .meal-btn.active{
    border-color:var(--teal);
    background:#e7f1f1;
    color:var(--teal-dark);
  }
  .ratio-card{
    display:none;
    border:2px solid var(--teal);
  }
  .ratio-card.show{display:block;}
  .mode-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:14px;
  }
  .mode-btn{
    border:2px solid var(--line);
    background:#fff;
    border-radius:12px;
    padding:14px 8px;
    font-size:0.9rem;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
    text-align:center;
  }
  .mode-btn.active{
    border-color:var(--teal);
    background:var(--teal);
    color:#fff;
  }
  /* ========== Champs de saisie ========== */

  .input-row{
    display:flex;
    align-items:center;
    border:2px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .input-row input{
    flex:1;
    border:0;
    padding:14px;
    font-size:1.4rem;
    font-weight:700;
    color:var(--ink);
    background:transparent;
    -moz-appearance:textfield;
  }
  .input-row input:focus{outline:none;}
  .input-row input::-webkit-outer-spin-button,
  .input-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .unit{
    padding:0 16px;
    color:var(--ink-soft);
    font-weight:600;
    font-size:0.95rem;
  }
  .select-field{
    width:100%;
    border:2px solid var(--line);
    border-radius:12px;
    padding:14px;
    font-size:1.1rem;
    font-weight:700;
    color:var(--ink);
    background:#fff;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235b6b6e'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat:no-repeat;
    background-position:right 14px center;
    background-size:20px;
  }
  /* ========== Résultat ========== */

  .calc-btn{
    width:100%;
    padding:16px;
    border:0;
    border-radius:14px;
    background:var(--teal);
    color:#fff;
    font-size:1.05rem;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
  }
  .calc-btn:active{background:var(--teal-dark);}
  .result{
    display:none;
  }
  .result.show{display:block;}
  .dose-total{
    text-align:center;
    padding:6px 0 4px;
  }
  .dose-total .num{
    font-size:3.2rem;
    font-weight:800;
    color:var(--teal-dark);
    line-height:1;
  }
  .dose-total .label{
    font-size:0.8rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-top:4px;
  }
  .breakdown{
    margin-top:14px;
    border-top:1px solid var(--line);
    padding-top:12px;
  }
  .breakdown-row{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    font-size:0.92rem;
  }
  .breakdown-row .v{font-weight:700;}
  .alert{
    display:none;
    padding:10px 2px 0;
    font-size:0.85rem;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .alert.show{display:block;}
</style>
</head>
<body>

<header>
  <h1>Bolus repas</h1>
</header>

<main>

  <!-- Étape 1 : choix du repas -->
  <div class="card">
    <h2>1 — Repas</h2>
    <div class="meals" id="meals">
      <button class="meal-btn" data-meal="petit_dej">Petit-déjeuner</button>
      <button class="meal-btn" data-meal="dejeuner">Déjeuner</button>
      <button class="meal-btn" data-meal="gouter">Goûter</button>
      <button class="meal-btn" data-meal="diner">Dîner</button>
    </div>
  </div>

  <!-- Ratio du repas choisi (apparaît une fois un repas sélectionné) -->
  <div class="card ratio-card" id="ratioBlock">
    <h2>RATIO</h2>
    <div class="mode-tabs" id="modeTabs">
      <button class="mode-btn active" data-mode="standard">Ratios pour 10 g de glucides</button>
      <button class="mode-btn" data-mode="grams">Ratios pour 1 unité d'insuline</button>
    </div>
    <select id="ratioSelect" class="select-field"></select>
  </div>

  <!-- Étape 2 : quantité de glucides -->
  <div class="card">
    <h2>2 — Glucides du repas</h2>
    <div class="input-row">
      <input type="number" id="glucides" inputmode="numeric" placeholder="0" min="0" step="1">
      <span class="unit">g</span>
    </div>
  </div>

  <!-- Étape 3 : facteur de correction -->
  <div class="card">
    <h2>3 — Facteur de correction</h2>
    <select id="sensibilite" class="select-field">
      <option value="20">20</option>
      <option value="25">25</option>
      <option value="30" selected>30</option>
      <option value="35">35</option>
      <option value="40">40</option>
      <option value="45">45</option>
      <option value="50">50</option>
      <option value="60">60</option>
      <option value="70">70</option>
      <option value="80">80</option>
      <option value="90">90</option>
      <option value="100">100</option>
    </select>
  </div>

  <!-- Étape 4 : glycémie actuelle -->
  <div class="card">
    <h2>4 — Glycémie actuelle</h2>
    <div class="input-row">
      <input type="number" id="glycemie" inputmode="numeric" placeholder="0" min="0" step="1">
      <span class="unit">mg/dL</span>
    </div>
  </div>

  <button class="calc-btn" id="calcBtn">Calculer la dose</button>

  <!-- Résultat du calcul -->
  <div class="card result" id="resultCard">
    <div class="dose-total">
      <div class="num" id="doseTotal">0</div>
      <div class="label">unités d'insuline</div>
    </div>
    <div class="breakdown">
      <div class="breakdown-row"><span>Dose repas</span><span class="v" id="doseRepas">0</span></div>
      <div class="breakdown-row"><span>Correctif glycémie</span><span class="v" id="doseCorrectif">0</span></div>
    </div>
    <div class="alert hypo" id="alertHypo">
      Sous 70 mg/dL : hors table, pas de valeur calculée.
    </div>
    <div class="alert high" id="alertHigh">
      Au-dessus de 400 mg/dL : hors table, pas de valeur calculée.
    </div>
  </div>

</main>

<script>

  /* ==========================================================
     RATIOS — valeurs par défaut et table de conversion
     ========================================================== */

  // Ratios par défaut par repas (valeurs du fichier Excel)
  const defaultRatios = {
    petit_dej: 2.0,
    dejeuner: 1.0,
    gouter: 1.0,
    diner: 1.0
  };

  // Table exacte du fichier de conversion : [ratio pour 10g, grammes pour 1 unité]
  const ratioPairs = [
    [0.5,20],[0.6,17],[0.7,14],[0.8,12.5],[0.9,11],[1.0,10],
    [1.1,9],[1.2,8.5],[1.3,7.7],[1.4,7.2],[1.5,6.7],[1.6,6.2],
    [1.7,5.9],[1.8,5.5],[1.9,5.3],[2.0,5],[2.1,4.8],[2.2,4.5],
    [2.3,4.3],[2.4,4.2],[2.5,4],[2.6,3.8],[2.7,3.7],[2.8,3.6],
    [2.9,3.5],[3.0,3.3],[3.1,3.2],[3.2,3.1],[3.3,3],[3.4,2.9],
    [3.5,2.9],[3.6,2.8],[3.7,2.7],[3.8,2.6],[3.9,2.6],[4.0,2.5]
  ];


  /* ==========================================================
     SÉLECTION DU REPAS ET DU RATIO
     ========================================================== */

  const meals = document.querySelectorAll('.meal-btn');
  const ratioSelect = document.getElementById('ratioSelect');
  const ratioBlock = document.getElementById('ratioBlock');

  let selectedRatio = null;
  let currentMode = 'standard';

  function fmt(n){
    return n.toString().replace('.', ',');
  }

  function renderRatioOptions(){
    ratioSelect.innerHTML = '';

    if(currentMode === 'standard'){
      ratioPairs.forEach(([c]) => {
        const opt = document.createElement('option');
        opt.value = c.toFixed(1);
        opt.textContent = fmt(c);
        ratioSelect.appendChild(opt);
      });
    } else {
      // Mode "grammes / unité" : trié par grammes croissants
      const sorted = [...ratioPairs].sort((a, b) => a[1] - b[1]);
      sorted.forEach(([c, d]) => {
        const opt = document.createElement('option');
        opt.value = c.toFixed(1);
        opt.textContent = fmt(d);
        ratioSelect.appendChild(opt);
      });
    }
  }

  function setRatio(value){
    selectedRatio = parseFloat(value);
    ratioSelect.value = selectedRatio.toFixed(1);
  }

  function ratioKey(meal){
    return 'ratio_' + meal;
  }

  // Bascule entre les deux modes d'affichage du ratio (10g de glucides / 1 unité d'insuline)
  document.getElementById('modeTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-btn');
    if(!btn) return;

    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;

    const currentRatio = selectedRatio;
    renderRatioOptions();
    if(currentRatio !== null){
      ratioSelect.value = currentRatio.toFixed(1);
    }
  });

  renderRatioOptions();

  // Sélection d'un repas : affiche le bloc ratio et recharge la dernière valeur mémorisée.
  // Recliquer sur un repas déjà actif le désélectionne et masque le bloc ratio.
  meals.forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.classList.contains('active')){
        btn.classList.remove('active');
        ratioBlock.classList.remove('show');
        selectedRatio = null;
        return;
      }

      meals.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ratioBlock.classList.add('show');

      const meal = btn.dataset.meal;
      const saved = localStorage.getItem(ratioKey(meal));
      setRatio(saved !== null ? saved : defaultRatios[meal]);
    });
  });

  // Changement manuel du ratio : mémorisé pour le repas actuellement sélectionné
  ratioSelect.addEventListener('change', (e) => {
    selectedRatio = parseFloat(e.target.value);
    const activeMeal = document.querySelector('.meal-btn.active');
    if(activeMeal){
      localStorage.setItem(ratioKey(activeMeal.dataset.meal), selectedRatio.toFixed(1));
    }
  });


  /* ==========================================================
     FACTEUR DE CORRECTION — table de correctif par glycémie
     ========================================================== */

  // Valeurs exactes du fichier Excel, par facteur de correction.
  // Ordre des paliers : [150-200, 200-250, 250-300, 300-350, 350-400]
  const correctifTables = {
    20:  [2.5, 5,   7.5, 9,   11.5],
    25:  [2,   4,   6,   8,   10],
    30:  [1.5, 3,   4.5, 6,   7.5],
    35:  [1.5, 3,   4.5, 6,   7.5],
    40:  [1,   2.5, 4,   5,   6],
    45:  [1,   2,   3,   4.5, 5.5],
    50:  [1,   2,   3,   4,   5],
    60:  [1,   1.5, 2.5, 3,   4],
    70:  [1,   1.5, 2,   3,   3.5],
    80:  [0.5, 1,   2,   2.5, 3],
    90:  [0.5, 1,   1.5, 2,   2.5],
    100: [0.5, 1,   1.5, 2,   2.5]
  };

  function correctif(glyc, sensibilite){
    const table = correctifTables[sensibilite];

    if(glyc < 70)  return {value: null, zone: 'hypo'};
    if(glyc < 150) return {value: 0,        zone: 'ok'};
    if(glyc < 200) return {value: table[0], zone: 'ok'};
    if(glyc < 250) return {value: table[1], zone: 'ok'};
    if(glyc < 300) return {value: table[2], zone: 'ok'};
    if(glyc < 350) return {value: table[3], zone: 'ok'};
    if(glyc < 400) return {value: table[4], zone: 'ok'};

    return {value: null, zone: 'high'};
  }

  document.getElementById('sensibilite').addEventListener('change', (e) => {
    localStorage.setItem('facteur_correction', e.target.value);
  });

  const savedSensibilite = localStorage.getItem('facteur_correction');
  if(savedSensibilite !== null){
    document.getElementById('sensibilite').value = savedSensibilite;
  }


  /* ==========================================================
     SERVICE WORKER — fonctionnement hors-ligne
     ========================================================== */

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }


  /* ==========================================================
     CALCUL DE LA DOSE
     ========================================================== */

  document.getElementById('calcBtn').addEventListener('click', () => {
    const glucides = parseFloat(document.getElementById('glucides').value) || 0;
    const glycemie = parseFloat(document.getElementById('glycemie').value);

    const resultCard = document.getElementById('resultCard');
    const alertHypo = document.getElementById('alertHypo');
    const alertHigh = document.getElementById('alertHigh');
    alertHypo.classList.remove('show');
    alertHigh.classList.remove('show');

    if(selectedRatio === null){
      document.querySelector('.meals').scrollIntoView({behavior: 'smooth'});
      return;
    }

    if(isNaN(glycemie)){
      document.getElementById('glycemie').focus();
      return;
    }

    // Reproduit QUOTIENT(glucides,10) de la formule Excel : arrondi à la dizaine inférieure
    const parts = Math.floor(glucides / 10);
    const doseRepas = parts * selectedRatio;

    const sensibilite = document.getElementById('sensibilite').value;
    const corr = correctif(glycemie, sensibilite);

    resultCard.classList.add('show');

    if(corr.zone === 'hypo'){
      alertHypo.classList.add('show');
      document.getElementById('doseTotal').textContent = '—';
      document.getElementById('doseRepas').textContent = doseRepas;
      document.getElementById('doseCorrectif').textContent = '—';
      return;
    }

    if(corr.zone === 'high'){
      alertHigh.classList.add('show');
      document.getElementById('doseTotal').textContent = '—';
      document.getElementById('doseRepas').textContent = doseRepas;
      document.getElementById('doseCorrectif').textContent = '—';
      return;
    }

    const total = doseRepas + corr.value;
    document.getElementById('doseTotal').textContent = total.toString().replace('.', ',');
    document.getElementById('doseRepas').textContent = doseRepas.toString().replace('.', ',') + ' u';
    document.getElementById('doseCorrectif').textContent = (corr.value > 0 ? '+' : '') + corr.value.toString().replace('.', ',') + ' u';
  });

</script>

</body>
</html>
